services:
  - type: web
    name: civicresolve
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run render:build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: http://localhost:10000
